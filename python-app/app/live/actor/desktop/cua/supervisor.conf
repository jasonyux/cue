[program:worker-bridge]
command=/opt/venv/bin/python3 /opt/actor/cua/server.py --host 0.0.0.0 --port 8100 --token %(ENV_CUA_DESKTOP_REMOTE_TOKEN)s --worker /opt/actor/worker.py
user=root
environment=HOME="/home/cua",DISPLAY=":1"
autorestart=true
stdout_logfile=/var/log/supervisor/worker-bridge.log
stderr_logfile=/var/log/supervisor/worker-bridge.error.log
priority=40

[program:theme]
command=/opt/actor/cua/theme.sh
user=root
autorestart=false
startsecs=0
startretries=0
stdout_logfile=/var/log/supervisor/theme.log
stderr_logfile=/var/log/supervisor/theme.log
priority=50
